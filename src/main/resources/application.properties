spring.application.name=CRMProject
server.port=8081

# PostgreSQL datasource - CORRECTED database name
spring.datasource.url=jdbc:postgresql://localhost:5433/postgres
spring.datasource.username=postgres
spring.datasource.password=database
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Explicitly tell Hibernate to look in the public schema
spring.jpa.properties.hibernate.default_schema=public

# Exclude Mongo (if you don't use it)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration

#spring.security.user.name=admin
#spring.security.user.password=admin123

# Enable execution of data.sql
#spring.sql.init.mode=always

logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG

# JWT Configuration
jwt.secret=your-very-secret-key-that-must-be-at-least-32-characters-long-for-hs256
# Short-lived access token (15 minutes)
jwt.expiration-ms=604800000 

# Long-lived refresh token (7 days)
jwt.refresh-expiration-ms=604800000


# Root level Loggers 
logging.level.root=INFO

# Your application
logging.level.com.crm=DEBUG

# Specific packages
logging.level.com.crm.security=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# Log file
logging.file.name=logs/crm-app.log

# Log pattern (optional)
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n



# Kafka Producer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false